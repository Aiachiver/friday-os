[project]
name = "friday-os"
dynamic = ["version"]
description = "FRIDAY OS - A production-grade AI desktop operating assistant"
authors = [{ name = "Suraj" }]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions", "alembic/env.py"]  # autogenerated/scaffolded -- not hand-maintained

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
platform = "win32"  # this project targets Windows; typeshed's conditional
                      # stubs for winreg/ctypes.windll etc. only resolve
                      # correctly when checking against the real target platform
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
